<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Chaos</title><style>*{box-sizing:border-box}body{background:#101021;color:#eee;font:16px monospace;margin:0;text-align:center}h1{color:#ffe066;font-size:clamp(30px,6vw,64px);text-shadow:4px 4px #a43b64;margin:20px 0 0}p{color:#a9a9cf}main{max-width:1000px;margin:auto;padding:12px}button,input{font:inherit;padding:12px;border:2px solid #655b91;background:#242440;color:white;border-radius:5px}button{cursor:pointer;background:#ffe066;color:#17172a;font-weight:bold}button:disabled{opacity:.4}canvas{width:100%;max-width:760px;image-rendering:pixelated;border:4px solid #655b91;background:#17172a}#roster{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px}#roster span{padding:8px;background:#242440;border-bottom:3px solid}#status{font-size:20px;color:#ffe066;min-height:30px}#controls{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}#controls button{touch-action:none} [hidden]{display:none!important}</style><main><h1>RETRO CHAOS</h1><p>◆ BOMB ARENA ◆ 2–7 JUGADORES</p><section id="join"><input id="name" maxlength="20" placeholder="Tu apodo"><button id="enter">ENTRAR</button></section><div id="status"></div><div id="roster"></div><button id="start" hidden>INICIAR RONDA</button><div><canvas id="board" width="608" height="480" hidden></canvas></div><p id="help">WASD / Flechas · ESPACIO para colocar bomba</p><div id="controls" hidden><button data-dir="left">◀</button><button data-dir="up">▲</button><button data-dir="down">▼</button><button data-dir="right">▶</button><button id="drop">💣</button></div><p>🔥 Alcance · + Bombas · ⚡ Velocidad</p></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id),c=$('board'),g=c.getContext('2d');let state={},keys=new Set(),notice='',noticeUntil=0;const dirs={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};$('enter').onclick=()=>s.emit('join',$('name').value);$('start').onclick=()=>s.emit('start');$('drop').onclick=()=>s.emit('bomb');s.on('notice',v=>{notice=v;noticeUntil=Date.now()+3000});s.on('disconnect',()=>{keys.clear();$('status').textContent='Conexión perdida…'});s.on('state',v=>{state=v;let me=v.players[s.id];$('join').hidden=!!me;$('start').hidden=s.id!==v.host||v.phase==='play';$('start').disabled=Object.keys(v.players).length<2;$('start').textContent=v.phase==='over'?'SIGUIENTE RONDA':'INICIAR RONDA';c.hidden=v.phase==='lobby';$('controls').hidden=v.phase!=='play'||!me?.alive;$('status').textContent=Date.now()<noticeUntil?notice:v.phase==='lobby'?'SALA DE ESPERA · '+Object.keys(v.players).length+'/7':v.phase==='over'?'🏆 '+v.winner:v.phase==='play'?'RONDA '+v.round+' · '+Math.max(0,Math.ceil((v.end-Date.now())/1000))+'s'+(me&&!me.alive?' · ESPECTADOR':''):'';$('roster').replaceChildren(...Object.entries(v.players).map(([id,p])=>{let el=document.createElement('span');el.style.borderColor=p.color;el.textContent=p.name+(id===s.id?' (TÚ)':'')+(id===v.host?' ★':'')+' | '+p.score+' pts'+(v.phase==='play'&&!p.alive?' ☠':'');return el}));});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let d=dirs[e.key]||dirs[e.key.toLowerCase()];if(d){e.preventDefault();keys.add(d)}if(e.code==='Space'){e.preventDefault();if(!e.repeat)s.emit('bomb')}});addEventListener('keyup',e=>keys.delete(dirs[e.key]||dirs[e.key.toLowerCase()]));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.dir)};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.dir)});setInterval(()=>{let d=[...keys].pop();if(d)s.emit('move',d)},45);
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function draw(){requestAnimationFrame(draw);if(!state.map?.length)return;state.map.forEach((r,y)=>r.forEach((v,x)=>{let a=x*32,b=y*32;rect(a,b,32,32,(x+y)%2?'#243e40':'#29484a');if(v===1){rect(a,b,32,32,'#39435d');rect(a+2,b+2,28,5,'#68748d');rect(a+2,b+27,28,3,'#20283e')}if(v===2){rect(a+2,b+2,28,28,'#a45e39');rect(a+5,b+5,22,22,'#d69550');rect(a+8,b+8,16,16,'#a45e39');rect(a+13,b+5,6,22,'#d69550')}}));for(let i of state.items){if(i.ready>Date.now())continue;rect(i.x*32+5,i.y*32+5,22,22,'#f5e7a0');g.font='bold 19px monospace';g.fillStyle='#202038';g.textAlign='center';g.fillText({range:'F',capacity:'+',speed:'S'}[i.type],i.x*32+16,i.y*32+23)}for(let b of state.bombs){let x=b.x*32,y=b.y*32;g.fillStyle='#10101c';g.beginPath();g.arc(x+16,y+18,12,0,7);g.fill();rect(x+12,y+9,5,4,'#aaa');rect(x+19,y+2,4,7,Math.sin(Date.now()/80)>0?'#ffea66':'#ff6542')}for(let f of state.fire){rect(f.x*32,f.y*32,32,32,'#ff713b');rect(f.x*32+5,f.y*32+5,22,22,'#ffdc55');rect(f.x*32+11,f.y*32+11,10,10,'#fff8cf')}for(let [id,p] of Object.entries(state.players)){if(!p.alive)continue;let x=p.x*32,y=p.y*32;rect(x+5,y+3,22,19,p.color);rect(x+9,y+8,14,11,'#ffe1b5');rect(x+11,y+11,3,5,'#151525');rect(x+19,y+11,3,5,'#151525');rect(x+9,y+22,14,6,p.color);rect(x+5,y+28,9,3,'#eee');rect(x+18,y+28,9,3,'#eee');if(id===s.id)rect(x+12,y,8,3,'white')}}draw();</script></html>
